name: Python Dependency Audit

on:
  push:
    paths: ['offline_pipeline/requirements.txt']
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit
        run: pip-audit -r offline_pipeline/requirements.txt
