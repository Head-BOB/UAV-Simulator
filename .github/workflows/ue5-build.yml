name: UE5 Build

on:
  workflow_dispatch: {}

concurrency:
  group: gpu-laptop-exclusive
  cancel-in-progress: false

jobs:
  build-ue5:
    name: Package UE5 Project
    runs-on: [self-hosted, windows, gpu-laptop]
    timeout-minutes: 360

    steps:
      - name: Check out code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Build Rust Physics Core
        working-directory: physics_core
        run: cargo build --release

      - name: Stage Rust DLL for Unreal Engine
        shell: cmd
        run: |
          mkdir "%CD%\UE5Project\Binaries\Win64" 2>nul
          copy /Y "%CD%\physics_core\target\release\physics_core.dll" "%CD%\UE5Project\Binaries\Win64\"

      - name: Run UAT BuildCookRun
        shell: cmd
        run: |
          set PATH=%CD%\physics_core\target\release;%PATH%
          "%UE5_PATH%\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun ^
          -project="%CD%\UE5Project\UAV_Simulator.uproject" ^
          -platform=Win64 -configuration=Development ^
          -build -cook -stage -package 

      - name: Upload build output
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ue5-build-output
          path: UE5Project/Saved/StagedBuilds/