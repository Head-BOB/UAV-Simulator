name: Comment Style Gate

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check for AI-assistant conversational artifacts
        run: python scripts/check_comment_style.py --changed-files-only --fail-on-match
