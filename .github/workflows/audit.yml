name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    name: Security and License Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics_core
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.96.0

      - name: Verify toolchain
        run: rustc --version

      - name: Install audit tools
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.20.2

      - name: Run Cargo Audit
        run: cargo audit

      - name: Run Cargo Deny
        run: cargo deny check