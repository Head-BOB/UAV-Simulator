name: Rust Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  unsafe-tracking:
    name: cargo geiger (unsafe usage report)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics_core
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-geiger
      - name: Report unsafe usage
        run: cargo geiger --output-format GitHubMarkdown >> $GITHUB_STEP_SUMMARY || true

  undefined-behavior-check:
    name: miri (pure physics subset, pinned nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    defaults:
      run:
        working-directory: physics_core
    env:
      # Pinned so a nightly regression cannot change the result silently. miri availability for this
      # date was read from rustup-components-history on 2026-10-09 (present 2026-10-03..09); the
      # job has NOT been run. TODO(HUMAN-VERIFY): run it once, then bump the date on purpose.
      MIRI_NIGHTLY: nightly-2026-10-05
      # The config and types tests read files, so host isolation is off for them.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: dtolnay/rust-toolchain@e49db0c75eab8a54985034ecb3af03d8865306ed # miri
        with:
          toolchain: nightly-2026-10-05
          components: miri, rust-src
      # --no-default-features leaves out the `onnx` feature (ONNX Runtime and every FFI function that
      # takes a surrogate handle), so only the pure modules run. `+toolchain` overrides rust-toolchain.toml.
      - name: Run miri on the pure subset
        run: cargo +"$MIRI_NIGHTLY" miri test --no-default-features --lib

  pedantic-lints:
    name: clippy pedantic (ratcheted)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics_core
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Count pedantic findings
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq not found"; exit 1; }
          # A failing or missing clippy stops the step here (set -e); it can no longer count as 0 findings.
          cargo clippy --release --message-format=json -- -W clippy::pedantic > clippy_pedantic.json
          COUNT=$(jq -s '[.[] | select(.reason == "compiler-message" and .message.level == "warning")] | length' clippy_pedantic.json)
          BASELINE=$(jq -e '.clippy_pedantic_baseline' ../static_analysis_baseline.json)
          [[ "$BASELINE" =~ ^[0-9]+$ ]] || { echo "::error::clippy_pedantic_baseline is not a whole number"; exit 1; }
          echo "Pedantic findings: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Pedantic findings increased ($COUNT > $BASELINE baseline)"
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::warning::Pedantic findings fell to $COUNT; lower clippy_pedantic_baseline to $COUNT (ratchet)"
          fi