name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Test, Lint, and SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics_core
    steps:
      - name: Check out code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Verify toolchain
        run: rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84
        with:
          workspaces: physics_core

      - name: Verify JSON line endings (LF only)
        working-directory: .
        run: |
          if grep -q $'\r' offline_pipeline/geometry/*.json; then
            echo "::error::CR (carriage return) bytes found in JSON files! Must be LF only."
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Generated FFI header matches the committed copy
        run: |
          touch build.rs
          cargo build --release
          git diff --exit-code -- ../UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public/Generated/drone_ffi.h
          test ! -e drone_ffi.h

      - name: Set up Python 3.12
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.12'

      - name: Fetch Secure ONNX Binary
        working-directory: .
        run: python tools/fetch_onnx.py

      - name: Run tests (debug)
        run: cargo test
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/onnxruntime-linux-x64-1.27.1/lib/libonnxruntime.so.1.27.1

      - name: Run tests (release)
        run: cargo test --release
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/onnxruntime-linux-x64-1.27.1/lib/libonnxruntime.so.1.27.1

      - name: Validation reports are current (model vs published data, report only)
        shell: bash
        run: |
          set -euo pipefail
          for b in reference_quad fpv_5in; do
            cargo run --release --example validate_models -- "../tools/parts/builds/$b" "$RUNNER_TEMP/val_$b"
            diff "$RUNNER_TEMP/val_$b/validation_report.json" "../tools/parts/builds/$b/validation_report.json"
            diff "$RUNNER_TEMP/val_$b/validation_report.csv" "../tools/parts/builds/$b/validation_report.csv"
          done

      - name: Test campaign smoke run is current and independent of the thread count
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 4; do
            cargo run --release --example run_campaign -- ../tools/parts/builds/reference_quad ../campaign/conditions_smoke.json ../campaign/smoke_definitions.json "$RUNNER_TEMP/camp_$n" --threads "$n" --git-hash golden > /dev/null
            diff -r "$RUNNER_TEMP/camp_$n" ../tools/parts/builds/reference_quad/campaign_smoke
          done

      - name: Pure subset without ONNX Runtime (the part miri runs)
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --no-default-features --all-targets -- -D warnings
          cargo test --no-default-features
          if cargo tree --no-default-features -e normal | grep -q ' ort v'; then
            echo "::error::ort is still in the dependency tree without the onnx feature"
            exit 1
          fi

      - name: Closed-loop DEMO flight sim against the real physics (g++, release library)
        working-directory: .
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/demo_flight_sim.cpp
          -o "$RUNNER_TEMP/demo_flight_sim"
          -Lphysics_core/target/release -lphysics_core
          "-Wl,-rpath,$PWD/physics_core/target/release"
          && "$RUNNER_TEMP/demo_flight_sim"

      - name: Mission runner tests against the real physics (g++, release library)
        working-directory: .
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/mission_runner_test.cpp
          -o "$RUNNER_TEMP/mission_runner_test"
          -Lphysics_core/target/release -lphysics_core
          "-Wl,-rpath,$PWD/physics_core/target/release"
          && "$RUNNER_TEMP/mission_runner_test"

      - name: Mission runner smoke test (writes the report files, checks the JSON parses)
        working-directory: .
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public \
            tools/cpp_ffi_check/mission_runner.cpp -o "$RUNNER_TEMP/mission_runner" \
            -Lphysics_core/target/release -lphysics_core "-Wl,-rpath,$PWD/physics_core/target/release"
          "$RUNNER_TEMP/mission_runner" --out "$RUNNER_TEMP/reports" --env Beach
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['findings'] and r['verdict']['text']" "$RUNNER_TEMP/reports/Beach/report.json"

      - name: Unit-test the Python tools
        working-directory: .
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Unit-test the FEA pipeline code
        working-directory: .
        run: python -m unittest discover -s offline_pipeline/fea -p 'test_*.py'

      - name: Unit-test the case runner
        working-directory: .
        run: python -m unittest discover -s offline_pipeline -p 'test_run_case.py'

      - name: Install hashed Python dependencies (numpy, onnx for the aero trainer test)
        working-directory: .
        run: python -m pip install --require-hashes -r offline_pipeline/requirements.txt

      - name: Unit-test the demo data, geometry and CFD tools
        working-directory: .
        run: |
          python -m unittest discover -s tools/props -p 'test_*.py'
          python -m unittest discover -s tools/geometry -p 'test_*.py'
          python -m unittest discover -s offline_pipeline/components -p 'test_*.py'
          python -m unittest discover -s offline_pipeline/cfd -p 'test_*.py'

      - name: Validate and test the parts database
        working-directory: .
        run: |
          python -m unittest discover -s tools/parts -p 'test_*.py'
          python tools/parts/parts_cli.py validate
          python tools/parts/parts_cli.py schema --check
          python tools/parts/build_vehicle.py tools/parts/builds/reference_quad.build.json --out tools/parts/builds/reference_quad --check
          python tools/parts/build_vehicle.py tools/parts/builds/fpv_5in.build.json --out tools/parts/builds/fpv_5in --check
          python tools/parts/extract_tmotor_table.py --check

      - name: Report tools - unit tests, and the committed smoke report is current
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/report -p 'test_*.py'
          python tools/report/make_report.py --build tools/parts/builds/reference_quad --campaign tools/parts/builds/reference_quad/campaign_smoke --validation tools/parts/builds/reference_quad/validation_report.json --out "$RUNNER_TEMP/report_smoke"
          diff -r "$RUNNER_TEMP/report_smoke" tools/parts/builds/reference_quad/report_smoke

      - name: Vehicle CFD pipeline without a GPU (geometry, sweep cases, sanity cases, synthetic training, verify)
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for b in reference_quad fpv_5in; do
            python offline_pipeline/cfd/vehicle_stl.py --build tools/parts/builds/$b --out "$RUNNER_TEMP/geo_$b"
            python offline_pipeline/cfd/vehicle_sweep.py generate --build tools/parts/builds/$b --out "$RUNNER_TEMP/sweep_$b" --bytes-per-cell 55 --max-cases 2
            python offline_pipeline/cfd/vehicle_sweep.py synthetic --build tools/parts/builds/$b --out "$RUNNER_TEMP/syn_$b.csv"
            python offline_pipeline/cfd/train_vehicle_aero.py train --build tools/parts/builds/$b --csv "$RUNNER_TEMP/syn_$b.csv" --out "$RUNNER_TEMP/m_$b.onnx" --now 2026-10-11T00:00:00+00:00
            python offline_pipeline/cfd/train_vehicle_aero.py verify --build tools/parts/builds/$b --model "$RUNNER_TEMP/m_$b.onnx" --csv "$RUNNER_TEMP/syn_$b.csv"
          done
          python offline_pipeline/cfd/sphere_validation.py generate-sphere --out "$RUNNER_TEMP/sphere" --bytes-per-cell 55
          python offline_pipeline/cfd/sphere_validation.py report --sphere "$RUNNER_TEMP/sphere" --out "$RUNNER_TEMP/sanity.json"
          python offline_pipeline/cfd/train_vehicle_aero.py verify --build tools/parts/builds/reference_quad --model offline_pipeline/cfd/sample/synthetic_quad_standard_aero.onnx --csv offline_pipeline/cfd/sample/synthetic_quad_standard_cfd.csv

      - name: P7 application flow test (UI model and screens against the REAL helpers) and catalogue is current
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python tools/parts/export_catalogue.py --check
          python tools/check_ui_tripwires.py
          g++ -std=c++17 -Wall -Wextra -Werror -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public tools/cpp_ffi_check/app_flow_test.cpp -o "$RUNNER_TEMP/app_flow_test"
          "$RUNNER_TEMP/app_flow_test" . python physics_core/target/release/examples/run_campaign physics_core/target/release/examples/validate_models "$RUNNER_TEMP/appflow"

      - name: P8 packaging tools - helpers lock is current, tests, and a dev-mode stage verifies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python tools/package/make_helpers_lock.py --check
          python -m unittest discover -s tools/package -p 'test_*.py'
          python tools/package/stage_package.py --dest "$RUNNER_TEMP/stage" --dev-python "$(command -v python)" --exe-dir physics_core/target/release/examples --exe-suffix ""

      - name: Run Traceability Check
        working-directory: .
        run: python tools/check_traceability.py

      - name: Check Tier headers (first line of every source file)
        working-directory: .
        run: python tools/check_tier_headers.py

      - name: Search for mass and inertia literals in non-test code
        working-directory: .
        run: python tools/check_mass_literals.py

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx -f json --all

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: rust-sbom
          path: physics_core/bom.json

  cpp-ffi-layout:
    name: C++ FFI layout asserts (no Unreal)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Show compiler version
        run: g++ --version

      - name: Syntax-check static_asserts in DroneFfiLayout.h
        run: >
          g++ -std=c++17 -fsyntax-only
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/ffi_layout_check.cpp

      - name: Build and run NED to Unreal conversion test
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/frame_conversion_test.cpp
          -o "$RUNNER_TEMP/frame_conversion_test"
          && "$RUNNER_TEMP/frame_conversion_test"

      - name: Build and run the demo wind generator test
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/wind_test.cpp
          -o "$RUNNER_TEMP/wind_test"
          && "$RUNNER_TEMP/wind_test"

      - name: Build and run the environment presets and weather validation test
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/environment_test.cpp
          -o "$RUNNER_TEMP/environment_test"
          && "$RUNNER_TEMP/environment_test"

      - name: Build and run the UI math test (contrast, smoothing, ticks, horizon, formatting)
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/ui_math_test.cpp
          -o "$RUNNER_TEMP/ui_math_test"
          && "$RUNNER_TEMP/ui_math_test"

      - name: Build and run the electrical formulas test
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/electrical_test.cpp
          -o "$RUNNER_TEMP/electrical_test"
          && "$RUNNER_TEMP/electrical_test"

      - name: Build and run the mission script test
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/mission_test.cpp
          -o "$RUNNER_TEMP/mission_test"
          && "$RUNNER_TEMP/mission_test"

      - name: Build and run the report engine test
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/report_test.cpp
          -o "$RUNNER_TEMP/report_test"
          && "$RUNNER_TEMP/report_test"

      - name: Build and run the prop spin, scale and disc math test
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/visual_math_test.cpp
          -o "$RUNNER_TEMP/visual_math_test"
          && "$RUNNER_TEMP/visual_math_test"

      - name: Build and run the DEMO controller pieces test
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror
          -I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public
          tools/cpp_ffi_check/demo_control_test.cpp
          -o "$RUNNER_TEMP/demo_control_test"
          && "$RUNNER_TEMP/demo_control_test"

      - name: P7 app logic tests without Unreal (JSON reader, tokens vs the UI preview, replay and margins vs the Python report, catalogue, build files, conditions, helpers, report data, app state)
        shell: bash
        run: |
          set -euo pipefail
          INC="-I UE5Project/Plugins/DronePhysicsBridge/Source/DronePhysicsBridge/Public"
          g++ -std=c++17 -Wall -Wextra -Werror $INC tools/cpp_ffi_check/json_test.cpp -o "$RUNNER_TEMP/json_test" && "$RUNNER_TEMP/json_test"
          g++ -std=c++17 -Wall -Wextra -Werror $INC tools/cpp_ffi_check/ui_tokens_test.cpp -o "$RUNNER_TEMP/ui_tokens_test" && "$RUNNER_TEMP/ui_tokens_test" dev-docs/ui-reference/quad_ui_preview_v4.html
          for t in replay_margins_test catalogue_build_test conditions_helpers_test report_state_test layout_test; do
            g++ -std=c++17 -Wall -Wextra -Werror $INC tools/cpp_ffi_check/$t.cpp -o "$RUNNER_TEMP/$t" && "$RUNNER_TEMP/$t" .
          done
          g++ -std=c++17 -Wall -Wextra -Werror $INC tools/cpp_ffi_check/fly_test.cpp -o "$RUNNER_TEMP/fly_test" && "$RUNNER_TEMP/fly_test" .
          g++ -std=c++17 -Wall -Wextra -Werror $INC tools/cpp_ffi_check/progress_test.cpp -o "$RUNNER_TEMP/progress_test" && "$RUNNER_TEMP/progress_test" . "$RUNNER_TEMP/progress_scratch"
          g++ -std=c++17 -Wall -Wextra -Werror $INC tools/cpp_ffi_check/ui_preview.cpp -o "$RUNNER_TEMP/ui_preview"
          g++ -std=c++17 -Wall -Wextra -Werror $INC tools/cpp_ffi_check/ui_files_writer.cpp -o "$RUNNER_TEMP/ui_files_writer"
