name: Model Promotion Gate

# A model reaches the build only through a reviewed pull request that changes
# offline_pipeline/trained_models/active_model.json (Completion Plan WP-10.4, exit gate 12).
# This job checks the manifest against the model files and the current geometry/config hashes.
# It does not merge, copy or open anything; a human reviews and merges.

on:
  pull_request:
    branches: [main]
    paths:
      - 'offline_pipeline/trained_models/**'
      - 'offline_pipeline/geometry/**'
      - 'offline_pipeline/promote_model.py'
      - 'offline_pipeline/test_promote_model.py'
      - 'offline_pipeline/test_surrogate_contract.py'
      - 'physics_core/src/surrogate/**'
      - 'offline_pipeline/requirements.txt'
      - '.github/workflows/model-promotion.yml'

jobs:
  check-manifest:
    name: Check active_model.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.12'
      - name: Install hashed Python dependencies
        run: python -m pip install --require-hashes -r offline_pipeline/requirements.txt
      - name: Unit-test the promotion tool
        run: python -m unittest discover -s offline_pipeline -p 'test_promote_model.py'
      - name: Surrogate input contract (stub models vs the Rust input layout)
        run: python -m unittest discover -s offline_pipeline -p 'test_surrogate_contract.py'
      - name: Check the manifest (fails on any mismatch)
        run: python offline_pipeline/promote_model.py --check
