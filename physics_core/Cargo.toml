[package]
name = "physics_core"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cbindgen = "0.29.4"
sha2 = "0.10.8"
hex = "0.4.3"

[profile.release]
panic = "abort"

[dependencies]
glam = "0.33.2"
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# `onnx` pulls in ONNX Runtime (surrogate loader and the FFI that uses it). Without it the crate is the
# pure physics subset that miri can run (static-analysis-rust.yml).
default = ["onnx"]
onnx = ["dep:ort"]
allow_stub_models = ["onnx"]