[package]
name = "physics_core"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cbindgen = "0.29.4"
sha2 = "0.10.8"
hex = "0.4.3"

[profile.release]
panic = "abort"

[dependencies]
glam = "0.33.2"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
allow_stub_models = []